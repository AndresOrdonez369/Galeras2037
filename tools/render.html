    #log { position: fixed; right: 8px; top: 8px; z-index: 2; width: 360px; max-height: 90vh; overflow: auto; background: #000c; padding: 10px; white-space: pre-wrap; }

  <script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/addons/" } }</script>

Necesita el servidor con GALERAS_DEV=1.

const SHOTS = [

  { n: 'c16-planta-camara', s: P34, plan: true, zoom: 1.35, cx: 0.47, cy: 0.25 },

  { n: 'c18-fotosecuencia', s: P34, pos: [-90, 1.6, 10], look: [-100, 5.6, 2], fov: 50, t: 9, fly: false },

  { n: 'e1-potrerillo', s: P45, ...cam('acceso'), t: 9 },
  { n: 'e2-calle-real', s: P45, ...cam('presion'), t: 9 },
  { n: 'e3-san-juan', s: P45, ...cam('desvio'), t: 9 },
  { n: 'e4-plaza', s: P45, pos: [-84, 4, -6], look: [-104, 2, 14], fov: 60, t: 9 },
  { n: 'e5-avenida', s: P45, ...cam('salida'), t: 9 },
  { n: 'c21-mercado-memorias', s: W169, pos: [-12, 2.4, 2.6], look: [-32, 3.4, -2], fov: 54, t: 40, fly: false },
];

const cv = document.getElementById('c');
function size([w, h]) { cv.style.width = w + 'px'; cv.style.height = h + 'px'; }
size(W169);
const market = await createMarket(cv, { pixelRatio: 1 });
const out = document.createElement('canvas');
const ctx = out.getContext('2d');

async function save(name) {
  const res = await fetch('/__guardar?nombre=' + name, { method: 'POST', body: out.toDataURL('image/jpeg', 0.88) });
  log(`${res.ok ? '✓' : '✗'} ${name}.jpg`);
}

async function renderShot(sh) {
  const [w, h] = sh.s; out.width = w; out.height = h;
  if (sh.plan) {
    const pc = await planCanvas();
    // recorte centrado en la Plaza de Nariño y la Calle Real
    const z = sh.zoom || 1, cw = pc.height * (w / h) / z, chh = pc.height / z;
    const cx = pc.width * (sh.cx || 0.42) - cw / 2, cy = (pc.height - chh) * (sh.cy ?? 0.5);
    ctx.fillStyle = '#ede8dc'; ctx.fillRect(0, 0, w, h);
    ctx.drawImage(pc, Math.max(0, cx), Math.max(0, cy), cw, chh, 0, 0, w, h);
    return save(sh.n);
  }
  size(sh.s); market.resize();
  if (sh.tour !== undefined) { market.shot(null); market.jump(sh.tour); market.renderOnce(80); }
  else { market.shot({ pos: sh.pos, look: sh.look, fov: sh.fov, design: sh.design || 0, t: sh.t, fly: sh.fly, gate: sh.gate }); market.renderOnce(50); }
  market.renderOnce(1);
  ctx.drawImage(cv, 0, 0, w, h);
  if (sh.bars) {
    const bh = Math.round((h - w / 2.39) / 2);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, bh); ctx.fillRect(0, h - bh, w, bh);
    ctx.font = '900 30px Doto, monospace'; ctx.fillStyle = '#d8d2c4'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ff4a3a'; ctx.beginPath(); ctx.arc(60, bh / 2, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#d8d2c4'; ctx.fillText('REC  PLANO 1 · 35 MM · 2.39:1', 80, bh / 2);
    ctx.fillText('CÉLULA 0 · PLAZA DE NARIÑO · TOMA 3', 50, h - bh / 2);
  }
  return save(sh.n);
}

window.renderAll = async (only) => {
  for (const sh of SHOTS) { if (only && !only.includes(sh.n)) continue; await renderShot(sh); }
  log('listo');
  window.renderDone = true;
};
log('escena lista');
window.sceneReady = true;
if (new URLSearchParams(location.search).has('auto')) renderAll();
</script>
</body>
</html>
